<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원근법 학습 - 두 손가락 줌(Zoom) 이동 추가</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* touch-action: none을 통해 모바일/패드에서 기본 스크롤 및 줌 동작 완벽 방지 */
        body { width: 100%; height: 100vh; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; background-color: #ffffff; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #drawCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; background: transparent;
        }

        #info, #controls {
            position: absolute; background: rgba(0, 0, 0, 0.8); color: white;
            padding: 15px 20px; border-radius: 10px; z-index: 100; transition: opacity 0.3s;
        }
        #info { top: 20px; left: 20px; font-family: monospace; }
        #controls { bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; }

        /* 모바일 이동 컨트롤 패드 */
        #mobileControls {
            position: absolute; bottom: 20px; left: 20px; display: none; 
            flex-direction: column; gap: 10px; z-index: 150;
        }
        #mobileControls button {
            background: rgba(0, 0, 0, 0.7); color: white; border: 2px solid #aaa;
            border-radius: 12px; width: 60px; height: 60px; font-size: 16px; font-weight: bold;
            cursor: pointer; user-select: none; touch-action: none; transition: 0.1s;
        }
        #mobileControls button:active { background: rgba(255, 255, 255, 0.5); }

        #drawControls {
            position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.8);
            color: white; padding: 15px; border-radius: 10px; z-index: 100;
            display: flex; flex-direction: column; gap: 12px; min-width: 270px;
            max-height: 90vh; overflow-y: auto;
        }
        .tool-group { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        
        /* 2단계 전용 메뉴 */
        .phase2-only { display: none; }
        
        .radio-group { display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 5px; }
        
        button { color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;}
        button:hover { filter: brightness(1.1); }
        
        /* 버튼 색상 */
        #undoBtn { background: #607D8B; }
        #clearBtn { background: #555; }
        #setVpBtn { background: #FF9800; border: 1px solid #fff; } 
        #phaseBtn { background: #4CAF50; border: 2px solid #fff; padding: 15px; }
        #saveBtn { background: #2196F3; }
        #resetBtn { background: #f44336; margin-top: 10px; } 
        
        .action-buttons { display: flex; gap: 10px; }
        .action-buttons button { flex: 1; }
        
        .hint { font-size: 12px; color: #ffeb3b; margin-top: 5px; line-height: 1.5; font-weight: bold;}
        .phase-indicator { font-weight: bold; font-size: 16px; color: #00e5ff; margin-bottom: 5px; text-align: center; }
        hr { border: 0; border-top: 1px solid #555; margin: 5px 0;}
    </style>
</head>
<body>
    <canvas id="drawCanvas"></canvas>

    <div id="info">
        <h3>🎨 1점 투시 마스터</h3>
        <p id="distance">이동 거리: 0 / 500 단위</p>
    </div>

    <div id="mobileControls">
        <button id="btnForward">▲ 앞</button>
        <button id="btnBackward">▼ 뒤</button>
    </div>

    <div id="drawControls">
        <div id="phaseText" class="phase-indicator">1단계: 소실점 가이드 그리기</div>
        
        <label style="color: #ffeb3b; font-weight: bold; cursor: pointer;">
            <input type="checkbox" id="drawModeToggle"> 🖍️ 드로잉 캔버스 활성화
        </label>
        
        <label style="color: #00e5ff; font-weight: bold; cursor: pointer;">
            <input type="checkbox" id="mobileCtrlToggle"> 📱 화면 이동 버튼 켜기
        </label>
        
        <div class="tool-group phase2-only" id="bgOpacityGroup">
            <span>배경 투명도:</span>
            <input type="range" id="bgOpacity" min="0" max="100" value="100" style="width:100px;">
        </div>
        <div class="tool-group phase2-only" id="gridOpacityGroup">
            <span>보조 눈금 투명도:</span>
            <input type="range" id="gridOpacity" min="0" max="100" value="25" style="width:100px;">
        </div>

        <div class="radio-group phase2-only" id="drawTools">
            <label><input type="radio" name="drawType" value="freehand" id="typeFreehand" checked> ✍️ 자유 곡선 (스케치)</label>
            <label><input type="radio" name="drawType" value="segment" id="typeSegment"> 📏 곧은 선분</label>
            <label><input type="radio" name="drawType" value="bucket" id="typeBucket"> 🪣 색 채우기 (양동이)</label>
        </div>
        <hr>

        <div class="tool-group">
            <span>펜 색상:</span>
            <input type="color" id="colorPicker" value="#ff0000">
        </div>
        <div class="tool-group">
            <span>펜 굵기:</span>
            <input type="range" id="lineWidth" min="1" max="15" value="3">
        </div>
        
        <button id="setVpBtn">📍 소실점 정하기</button>
        
        <div class="action-buttons">
            <button id="undoBtn">↩️ 되돌리기</button>
            <button id="clearBtn">🗑️ 모두 지우기</button>
        </div>
        
        <p class="hint" id="modeHint">
            1. 무한 직선으로 소실점을 찾으세요.<br>
            2. [소실점 정하기]를 눌러 점을 찍으세요.
        </p>
        <hr>
        
        <button id="phaseBtn">➡️ 2단계: 그림 그리기로 넘어가기</button>
        <button id="saveBtn" class="phase2-only">💾 내 작품 이미지로 저장하기</button>
        
        <button id="resetBtn">🔄 처음부터 다시하기</button>
    </div>

    <div id="controls">
        <p>W / S : 앞뒤 이동 | <b>Shift + 이동 : 빠르게</b> | <b>두 손가락 줌: 앞/뒤 줌 이동</b></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==========================================
        // 1. Three.js 3D 환경 설정
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 200, 2000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const START_Z = 50;
        const MAX_DISTANCE = 500;
        const MIN_Z = START_Z - MAX_DISTANCE; 

        camera.position.set(0, 10, START_Z); 
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.domElement.id = 'threeCanvas';
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(100, 100, 100);
        sun.castShadow = true;
        scene.add(sun);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 5000), new THREE.MeshStandardMaterial({ color: 0xccccaa, roughness: 0.8 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        function createBuilding(x, z, width, height, depth, color) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), new THREE.MeshStandardMaterial({ color: color }));
            body.position.y = height / 2;
            body.castShadow = true;
            group.add(body);
            group.position.set(x, 0, z);
            scene.add(group);
        }

        function createTree(x, z, scale = 1) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5*scale, 0.8*scale, 8*scale), new THREE.MeshStandardMaterial({ color: 0x654321 }));
            trunk.position.y = 4*scale;
            group.add(trunk);
            const foliage = new THREE.Mesh(new THREE.ConeGeometry(5*scale, 10*scale), new THREE.MeshStandardMaterial({ color: 0x558844 }));
            foliage.position.y = 9*scale;
            group.add(foliage);
            group.position.set(x, 0, z);
            scene.add(group);
        }

        for(let i=0; i<4; i++) {
            let zPos = START_Z - (i * 120); 
            createBuilding(-30, zPos, 12, 26, 12, 0x8b6f47);
            createBuilding(30, zPos, 12, 26, 12, 0x9d7e52);
            createTree(-15, zPos + 20, 1.5);
            createTree(15, zPos + 20, 1.5);
        }

        // ==========================================
        // 이동 키 및 버튼 이벤트 처리
        // ==========================================
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; if (e.ctrlKey && e.key.toLowerCase() === 'z') { undoPath(); } });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        const mobileCtrlToggle = document.getElementById('mobileCtrlToggle');
        const mobileControls = document.getElementById('mobileControls');
        mobileCtrlToggle.addEventListener('change', (e) => {
            mobileControls.style.display = e.target.checked ? 'flex' : 'none';
        });

        const btnFwd = document.getElementById('btnForward');
        const btnBwd = document.getElementById('btnBackward');
        const pressFwd = (e) => { e.preventDefault(); keys['w'] = true; };
        const releaseFwd = (e) => { e.preventDefault(); keys['w'] = false; };
        const pressBwd = (e) => { e.preventDefault(); keys['s'] = true; };
        const releaseBwd = (e) => { e.preventDefault(); keys['s'] = false; };

        btnFwd.addEventListener('mousedown', pressFwd); btnFwd.addEventListener('touchstart', pressFwd);
        btnFwd.addEventListener('mouseup', releaseFwd); btnFwd.addEventListener('mouseleave', releaseFwd); btnFwd.addEventListener('touchend', releaseFwd);
        btnBwd.addEventListener('mousedown', pressBwd); btnBwd.addEventListener('touchstart', pressBwd);
        btnBwd.addEventListener('mouseup', releaseBwd); btnBwd.addEventListener('mouseleave', releaseBwd); btnBwd.addEventListener('touchend', releaseBwd);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            let speed = keys['shift'] ? 45 : 30; 
            if (keys['w']) camera.position.z -= speed * delta;
            if (keys['s']) camera.position.z += speed * delta;
            
            // 카메라 위치 제한 방어코드
            if (camera.position.z < MIN_Z) camera.position.z = MIN_Z;
            if (camera.position.z > START_Z) camera.position.z = START_Z;
            
            camera.position.y = 10; 
            document.getElementById('distance').textContent = `이동 거리: ${Math.abs(START_Z - camera.position.z).toFixed(1)} / ${MAX_DISTANCE} 단위`;
            renderer.render(scene, camera);
        }
        animate();

        // ==========================================
        // 2. 2D 캔버스, 패드 최적화 및 줌(Zoom) 기능
        // ==========================================
        const drawCanvas = document.getElementById('drawCanvas');
        const ctx = drawCanvas.getContext('2d');
        const drawModeToggle = document.getElementById('drawModeToggle');
        const phaseBtn = document.getElementById('phaseBtn');
        const setVpBtn = document.getElementById('setVpBtn');
        const undoBtn = document.getElementById('undoBtn');
        const resetBtn = document.getElementById('resetBtn');
        const bgOpacityInput = document.getElementById('bgOpacity');
        const gridOpacityInput = document.getElementById('gridOpacity');
        
        let paths = [];
        let currentPath = null;
        let isDrawing = false;
        let isDrawingPhase = false; 
        let vp = null; 
        let isSettingVP = false; 
        
        // 두 손가락 줌 처리를 위한 변수
        let initialPinchDist = null;

        bgOpacityInput.addEventListener('input', (e) => { document.getElementById('threeCanvas').style.opacity = e.target.value / 100; });
        gridOpacityInput.addEventListener('input', () => { redrawAll(); });

        // 두 터치 지점 사이의 거리를 계산하는 함수
        function getPinchDist(e) {
            if (!e.touches || e.touches.length < 2) return 0;
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // 터치 1개일 때 이벤트 좌표
        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        // 기능 함수들
        function undoPath() {
            if (paths.length > 0) { paths.pop(); redrawAll(); }
        }
        undoBtn.addEventListener('click', undoPath);
        document.getElementById('clearBtn').addEventListener('click', () => { paths = []; vp = null; redrawAll(); });

        resetBtn.addEventListener('click', () => {
            if(!confirm("모든 작업이 삭제되고 처음으로 돌아갑니다. 계속하시겠습니까?")) return;
            paths = []; vp = null; isDrawingPhase = false; isSettingVP = false;
            camera.position.z = START_Z;
            document.getElementById('threeCanvas').style.opacity = 1;
            bgOpacityInput.value = 100; gridOpacityInput.value = 25;
            document.getElementById('phaseText').textContent = "1단계: 소실점 가이드 그리기";
            document.getElementById('phaseText').style.color = "#00e5ff";
            document.getElementById('modeHint').innerHTML = "1. 무한 직선으로 소실점을 찾으세요.<br>2. [소실점 정하기]를 눌러 점을 찍으세요.";
            document.getElementById('modeHint').style.color = "#ffeb3b";
            const p2Elements = document.querySelectorAll('.phase2-only');
            p2Elements.forEach(el => el.style.display = 'none');
            phaseBtn.style.display = 'block'; setVpBtn.style.display = 'block';
            drawModeToggle.checked = true; drawCanvas.style.pointerEvents = 'auto'; drawCanvas.style.cursor = 'default';
            redrawAll();
        });

        // 색상 및 채우기 알고리즘, 그리기 함수 등 기존 코드와 동일 (생략 없이 포함)
        function hexToRgba(hex) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return [r, g, b, 255];
        }

        function floodFill(startX, startY, fillColor) {
            const w = drawCanvas.width, h = drawCanvas.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const startOffset = (startY * w + startX) * 4;
            const targetColor = [data[startOffset], data[startOffset+1], data[startOffset+2], data[startOffset+3]];
            const fillRgba = hexToRgba(fillColor);

            if (Math.abs(targetColor[0] - fillRgba[0]) < 5 && Math.abs(targetColor[1] - fillRgba[1]) < 5 && 
                Math.abs(targetColor[2] - fillRgba[2]) < 5 && targetColor[3] > 200) return null;

            const fillLayer = new ImageData(w, h);
            const fData = fillLayer.data;

            function match(offset) {
                const r = data[offset], g = data[offset+1], b = data[offset+2], a = data[offset+3];
                if (targetColor[3] === 0) return a < 150; 
                return Math.abs(r - targetColor[0]) < 30 && Math.abs(g - targetColor[1]) < 30 &&
                       Math.abs(b - targetColor[2]) < 30 && Math.abs(a - targetColor[3]) < 30;
            }

            const stack = [startX, startY];
            while (stack.length > 0) {
                let y = stack.pop(), x = stack.pop();
                let offset = (y * w + x) * 4;
                let startX2 = x;
                while (startX2 >= 0 && match(offset)) { startX2--; offset -= 4; }
                startX2++; offset += 4;
                let reachAbove = false, reachBelow = false;
                while (startX2 < w && match(offset)) {
                    data[offset] = fillRgba[0]; data[offset+1] = fillRgba[1]; data[offset+2] = fillRgba[2]; data[offset+3] = fillRgba[3];
                    fData[offset] = fillRgba[0]; fData[offset+1] = fillRgba[1]; fData[offset+2] = fillRgba[2]; fData[offset+3] = fillRgba[3];
                    if (y > 0) {
                        if (match(offset - w * 4)) { if (!reachAbove) { stack.push(startX2, y - 1); reachAbove = true; } }
                        else if (reachAbove) { reachAbove = false; }
                    }
                    if (y < h - 1) {
                        if (match(offset + w * 4)) { if (!reachBelow) { stack.push(startX2, y + 1); reachBelow = true; } }
                        else if (reachBelow) { reachBelow = false; }
                    }
                    startX2++; offset += 4;
                }
            }
            const offCanvas = document.createElement('canvas');
            offCanvas.width = w; offCanvas.height = h;
            offCanvas.getContext('2d').putImageData(fillLayer, 0, 0);
            return offCanvas;
        }

        function redrawAll() {
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            const renderPaths = currentPath ? [...paths, currentPath] : paths;
            renderPaths.forEach(p => {
                if (p.type === 'fill') {
                    ctx.drawImage(p.img, 0, 0);
                } else {
                    ctx.beginPath();
                    ctx.strokeStyle = (isDrawingPhase && p.isGuide) ? '#d0d0d0' : p.color;
                    ctx.lineWidth = p.width;
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

                    if (p.type === 'line') {
                        const dx = p.endX - p.startX; const dy = p.endY - p.startY;
                        const len = Math.sqrt(dx*dx + dy*dy);
                        if (len > 0.1) {
                            const ux = dx / len; const uy = dy / len;
                            ctx.moveTo(p.startX - ux * 5000, p.startY - uy * 5000);
                            ctx.lineTo(p.startX + ux * 5000, p.startY + uy * 5000);
                        }
                    } else if (p.type === 'segment') {
                        ctx.moveTo(p.startX, p.startY); ctx.lineTo(p.endX, p.endY);
                    } else if (p.type === 'freehand') {
                        if (p.points.length > 0) {
                            ctx.moveTo(p.points[0].x, p.points[0].y);
                            p.points.forEach(pt => ctx.lineTo(pt.x, pt.y));
                        }
                    }
                    ctx.stroke();
                }
            });

            if (vp) {
                let gridAlpha = gridOpacityInput.value / 100;
                if (gridAlpha > 0) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(120, 120, 120, ${gridAlpha})`; 
                    ctx.lineWidth = 1; ctx.lineCap = 'butt';
                    for (let a = 0; a < 360; a += 10) {
                        let rad = a * Math.PI / 180;
                        ctx.moveTo(vp.x, vp.y); ctx.lineTo(vp.x + Math.cos(rad) * 4000, vp.y + Math.sin(rad) * 4000);
                    }
                    let maxSize = Math.max(drawCanvas.width, drawCanvas.height);
                    for (let i = 0; i < maxSize; i += 80) {
                        ctx.moveTo(0, vp.y + i); ctx.lineTo(drawCanvas.width, vp.y + i);
                        ctx.moveTo(0, vp.y - i); ctx.lineTo(drawCanvas.width, vp.y - i);
                        ctx.moveTo(vp.x + i, 0); ctx.lineTo(vp.x + i, drawCanvas.height);
                        ctx.moveTo(vp.x - i, 0); ctx.lineTo(vp.x - i, drawCanvas.height);
                    }
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
                ctx.arc(vp.x, vp.y, 5, 0, Math.PI * 2); ctx.fill();
            }
        }

        setVpBtn.addEventListener('click', () => {
            isSettingVP = true; drawModeToggle.checked = true;
            drawCanvas.style.pointerEvents = 'auto'; drawCanvas.style.cursor = 'crosshair';
            document.getElementById('modeHint').innerHTML = "🔴 <b>화면에서 선들이 모이는 '소실점' 위치를 클릭하세요!</b>";
            document.getElementById('modeHint').style.color = "#ff5252";
        });

        phaseBtn.addEventListener('click', () => {
            isDrawingPhase = true;
            document.getElementById('phaseText').textContent = "2단계: 자유 드로잉 & 색 채우기";
            document.getElementById('phaseText').style.color = "#4CAF50";
            document.getElementById('modeHint').innerHTML = "💡 배경 및 눈금 투명도를 조절해 스케치에 집중하세요.<br>💡 '곧은 선분'으로 건물을 반듯하게 그릴 수 있습니다.";
            document.getElementById('modeHint').style.color = "#ffeb3b";
            const p2Elements = document.querySelectorAll('.phase2-only');
            p2Elements.forEach(el => {
                if(el.id === 'drawTools' || el.id === 'bgOpacityGroup' || el.id === 'gridOpacityGroup') el.style.display = 'flex';
                else el.style.display = 'block';
            });
            phaseBtn.style.display = 'none'; setVpBtn.style.display = 'none';
            drawModeToggle.checked = true; drawCanvas.style.pointerEvents = 'auto'; drawCanvas.style.cursor = 'default';
            redrawAll();
        });

        drawModeToggle.addEventListener('change', (e) => drawCanvas.style.pointerEvents = e.target.checked ? 'auto' : 'none');

        // ==========================================
        // 드로잉 및 제스처 이벤트 (줌인/아웃 로직 추가)
        // ==========================================
        function handleDrawStart(e) {
            if (!drawModeToggle.checked) return;

            // ★ 두 손가락 터치 시: 그리기 취소 및 줌 시작
            if (e.touches && e.touches.length === 2) {
                initialPinchDist = getPinchDist(e);
                isDrawing = false; 
                currentPath = null;
                redrawAll();
                return;
            }

            const pos = getEventPos(e);
            if (isSettingVP) {
                vp = { x: pos.x, y: pos.y }; isSettingVP = false; drawCanvas.style.cursor = 'default';
                document.getElementById('modeHint').innerHTML = "✅ 소실점이 설정되었습니다. 격자를 확인하세요!<br>이제 그림그리기로 넘어갈 수 있습니다.";
                document.getElementById('modeHint').style.color = "#4CAF50";
                redrawAll(); return; 
            }

            let currentTool = 'line'; 
            if (isDrawingPhase) currentTool = document.querySelector('input[name="drawType"]:checked').value;
            
            if (currentTool === 'bucket') {
                const fillCanvas = floodFill(Math.floor(pos.x), Math.floor(pos.y), colorPicker.value);
                if (fillCanvas) { paths.push({ type: 'fill', img: fillCanvas }); redrawAll(); }
            } else {
                isDrawing = true;
                const isGuideLine = !isDrawingPhase; 
                if (currentTool === 'line') currentPath = { type: 'line', startX: pos.x, startY: pos.y, endX: pos.x, endY: pos.y, color: colorPicker.value, width: lineWidth.value, isGuide: isGuideLine };
                else if (currentTool === 'segment') currentPath = { type: 'segment', startX: pos.x, startY: pos.y, endX: pos.x, endY: pos.y, color: colorPicker.value, width: lineWidth.value, isGuide: isGuideLine };
                else if (currentTool === 'freehand') currentPath = { type: 'freehand', points: [{x: pos.x, y: pos.y}], color: colorPicker.value, width: lineWidth.value, isGuide: isGuideLine };
            }
        }

        function handleDrawMove(e) {
            e.preventDefault(); // 스크롤 방지 필수
            
            // ★ 두 손가락 줌(Zoom) 이동
            if (e.touches && e.touches.length === 2) {
                if (initialPinchDist !== null) {
                    const currentDist = getPinchDist(e);
                    const delta = currentDist - initialPinchDist; // 벌어지면 양수, 오므리면 음수
                    
                    // 확대(벌림) = 앞(Z감소), 축소(오므림) = 뒤(Z증가)
                    const zoomSpeed = 0.5; // 이동 감도 조절
                    camera.position.z -= delta * zoomSpeed;
                    
                    if (camera.position.z < MIN_Z) camera.position.z = MIN_Z;
                    if (camera.position.z > START_Z) camera.position.z = START_Z;
                    
                    initialPinchDist = currentDist; // 부드러운 연속 이동을 위해 업데이트
                }
                return;
            }

            if (!isDrawing || !currentPath) return;
            const pos = getEventPos(e);
            if (currentPath.type === 'line' || currentPath.type === 'segment') { currentPath.endX = pos.x; currentPath.endY = pos.y; }
            else if (currentPath.type === 'freehand') { currentPath.points.push({x: pos.x, y: pos.y}); }
            redrawAll();
        }

        function handleDrawEnd(e) {
            // 손가락을 하나라도 떼면 줌 상태 초기화
            if (e.touches && e.touches.length < 2) {
                initialPinchDist = null;
            }
            if (isDrawing && currentPath) { paths.push(currentPath); currentPath = null; isDrawing = false; redrawAll(); }
        }

        drawCanvas.addEventListener('mousedown', handleDrawStart);
        drawCanvas.addEventListener('mousemove', handleDrawMove);
        window.addEventListener('mouseup', handleDrawEnd);

        drawCanvas.addEventListener('touchstart', handleDrawStart, {passive: false});
        drawCanvas.addEventListener('touchmove', handleDrawMove, {passive: false});
        window.addEventListener('touchend', handleDrawEnd);

        // 이미지 저장
        document.getElementById('saveBtn').addEventListener('click', () => {
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = window.innerWidth; finalCanvas.height = window.innerHeight;
            const fCtx = finalCanvas.getContext('2d');
            
            fCtx.fillStyle = '#ffffff'; fCtx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
            fCtx.globalAlpha = bgOpacityInput.value / 100;
            fCtx.drawImage(document.getElementById('threeCanvas'), 0, 0);
            
            fCtx.globalAlpha = 1.0;
            paths.forEach(p => {
                if (p.isGuide) return; 
                if (p.type === 'fill') { fCtx.drawImage(p.img, 0, 0); }
                else {
                    fCtx.beginPath(); fCtx.strokeStyle = p.color; fCtx.lineWidth = p.width;
                    fCtx.lineCap = 'round'; fCtx.lineJoin = 'round';
                    if (p.type === 'segment') { fCtx.moveTo(p.startX, p.startY); fCtx.lineTo(p.endX, p.endY); }
                    else if (p.type === 'freehand') {
                        if (p.points.length > 0) {
                            fCtx.moveTo(p.points[0].x, p.points[0].y);
                            p.points.forEach(pt => fCtx.lineTo(pt.x, pt.y));
                        }
                    }
                    fCtx.stroke();
                }
            });
            const link = document.createElement('a'); 
            link.download = 'my_perspective_art.png'; link.href = finalCanvas.toDataURL(); link.click();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            drawCanvas.width = window.innerWidth; drawCanvas.height = window.innerHeight;
            redrawAll();
        });
        drawCanvas.width = window.innerWidth; drawCanvas.height = window.innerHeight;
    </script>
</body>
</html>
