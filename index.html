<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원근법 마스터</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* 배경색을 검은색(#000)에서 흰색(#ffffff)으로 변경하여 투명도를 낮췄을 때 하얀 도화지처럼 보이게 함 */
        body { width: 100%; height: 100vh; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; background-color: #ffffff; touch-action: none; }
        
        /* 레이어 구조 */
        #threeCanvas { position: absolute; top: 0; left: 0; z-index: 1; }
        #imgBgCanvas { position: absolute; top: 0; left: 0; z-index: 5; display: none; pointer-events: none; }
        #drawCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: auto; background: transparent; }

        /* UI 레이어 (z-index: 100 이상) */
        #info, #controls, #drawControls, #mobileControls { z-index: 100; }
        #info { position: absolute; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.8); color: white; padding: 15px; border-radius: 10px; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); color: white; padding: 10px 20px; border-radius: 10px; }
        
        /* 모바일 조작 패드 */
        #mobileControls {
            position: absolute; bottom: 20px; left: 20px; display: none; 
            flex-direction: column; gap: 10px;
        }
        #mobileControls button {
            background: rgba(0, 0, 0, 0.7); color: white; border: 2px solid #aaa;
            border-radius: 12px; width: 60px; height: 60px; font-size: 16px; font-weight: bold;
            cursor: pointer; user-select: none; touch-action: none;
        }

        #drawControls { position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.9); color: white; padding: 20px; border-radius: 10px; width: 300px; max-height: 90vh; overflow-y: auto; }
        
        .tool-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .phase2-only { display: none; }
        hr { border: 0; border-top: 1px solid #444; margin: 10px 0; }
        button { cursor: pointer; padding: 10px; border-radius: 5px; border: none; font-weight: bold; transition: 0.2s; font-size: 14px;}
        button:active { transform: scale(0.95); }

        #loadImageBtn { background: #E91E63; color: white; width: 100%; margin-bottom: 10px; }
        #setVpBtn { background: #FF9800; color: white; width: 100%; margin-top: 10px; }
        #phaseBtn { background: #4CAF50; color: white; width: 100%; padding: 15px; font-size: 16px; }
        .action-btns { display: flex; gap: 5px; margin-top: 10px; }
        .action-btns button { flex: 1; background: #555; color: white; }
        #undoBtn { background: #607D8B; }
        #resetBtn { background: #f44336; color: white; width: 100%; margin-top: 15px; }

        .hint { font-size: 12px; color: #ffeb3b; margin-top: 8px; line-height: 1.4; }
    </style>
</head>
<body>
    <canvas id="imgBgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>

    <div id="info">
        <h3>🎨 원근법 마스터</h3>
        <p id="distance">이동 거리: 0 / 500</p>
    </div>

    <div id="mobileControls">
        <button id="btnForward">▲ 앞</button>
        <button id="btnBackward">▼ 뒤</button>
    </div>

    <div id="drawControls">
        <div id="phaseText" style="text-align:center; color:#00e5ff; font-weight:bold; font-size: 16px; margin-bottom:10px;">1단계: 소실점 찾기</div>
        
        <button id="loadImageBtn">📷 배경 사진 넣기 (선택)</button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        
        <div id="imgBgOpGroup" class="tool-group" style="display:none;">
            <span>사진 투명도:</span>
            <input type="range" id="imgBgOpacity" min="0" max="100" value="100">
        </div>
        <hr>

        <label style="color: #ffeb3b; font-weight: bold; cursor: pointer; display: block; margin-bottom: 10px;">
            <input type="checkbox" id="drawModeToggle" checked> 🖍️ 드로잉 모드 활성화
        </label>

        <label style="color: #00e5ff; font-weight: bold; cursor: pointer; display: block; margin-bottom: 10px;">
            <input type="checkbox" id="mobileCtrlToggle"> 📱 화면 이동 버튼 켜기
        </label>

        <div class="phase2-only">
            <div class="tool-group">
                <span>3D배경 투명도:</span>
                <input type="range" id="bgOpacity" min="0" max="100" value="100">
            </div>
            <div class="tool-group">
                <span>격자 가이드 투명도:</span>
                <input type="range" id="gridOpacity" min="0" max="100" value="25">
            </div>
            <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 5px; margin-bottom:10px; font-size: 14px; line-height: 1.8;">
                <label><input type="radio" name="drawType" value="freehand" checked> ✍️ 자유곡선</label><br>
                <label><input type="radio" name="drawType" value="segment"> 📏 선분</label><br>
                <label><input type="radio" name="drawType" value="bucket"> 🪣 채우기</label>
            </div>
        </div>

        <div class="tool-group">
            <span>색상:</span>
            <input type="color" id="colorPicker" value="#ff0000">
        </div>
        <div class="tool-group">
            <span>두께:</span>
            <input type="range" id="lineWidth" min="1" max="15" value="3">
        </div>

        <button id="setVpBtn">📍 소실점 확정하기</button>
        
        <div class="action-btns">
            <button id="undoBtn">↩️ 되돌리기</button>
            <button id="clearBtn">🗑️ 비우기</button>
        </div>

        <p class="hint" id="modeHint">무한 직선을 그어 소실점을 찾으세요.<br>마우스 클릭 또는 터치로 그려집니다.</p>
        <hr>

        <button id="phaseBtn">➡️ 2단계: 그림 그리기</button>
        <button id="saveBtn" class="phase2-only" style="background:#2196F3; color:white; width:100%; margin-top:5px;">💾 내 작품 저장하기</button>
        <button id="resetBtn">🔄 처음부터 다시</button>
    </div>

    <div id="controls">
        PC: W/S 이동 | 패드: 두 손가락 줌(Zoom) 이동
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==========================================
        // 1. Three.js 설정 (디테일 3D 배경 복구)
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 200, 2000);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true }); // alpha: true 추가
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.domElement.id = 'threeCanvas';
        document.body.appendChild(renderer.domElement);

        const START_Z = 50;
        const MAX_DISTANCE = 500;
        const MIN_Z = START_Z - MAX_DISTANCE;
        camera.position.set(0, 10, START_Z);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(100, 100, 100);
        sun.castShadow = true;
        scene.add(sun);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 5000), new THREE.MeshStandardMaterial({ color: 0xccccaa, roughness: 0.8 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 디테일한 건물 생성 함수 복구
        function createBuilding(x, z, width, height, depth, color) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 }));
            body.position.y = height / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            const winGeo = new THREE.BoxGeometry(1, 1, 0.2);
            const winMat = new THREE.MeshStandardMaterial({ color: 0xffff99, emissive: 0xffff00, emissiveIntensity: 0.3 });
            
            for (let f = 0; f < Math.floor(height / 3); f++) {
                for (let s = 0; s < Math.floor(width / 2); s++) {
                    const win = new THREE.Mesh(winGeo, winMat);
                    win.position.set(-width / 2 + 1.5 + s * 2, 1.5 + f * 3, depth / 2 + 0.2);
                    group.add(win);
                }
            }
            group.position.set(x, 0, z);
            scene.add(group);
        }

        // 디테일한 나무 생성 함수 복구
        function createTree(x, z, scale = 1) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5*scale, 0.8*scale, 8*scale), new THREE.MeshStandardMaterial({ color: 0x654321 }));
            trunk.position.y = 4*scale;
            trunk.castShadow = true;
            group.add(trunk);
            const foliage = new THREE.Mesh(new THREE.ConeGeometry(5*scale, 10*scale), new THREE.MeshStandardMaterial({ color: 0x558844 }));
            foliage.position.y = 9*scale;
            foliage.castShadow = true;
            group.add(foliage);
            group.position.set(x, 0, z);
            scene.add(group);
        }

        const leftColors = [0xb8860b, 0x8b6f47, 0x8b7355, 0x6b5d52];
        const rightColors = [0xa67c52, 0x9d7e52, 0x7d6e5f, 0x5d4e45];
        for(let i=0; i<4; i++) {
            let zPos = START_Z - (i * 120); 
            createBuilding(-30, zPos, 12, 26, 12, leftColors[i]);
            createBuilding(30, zPos, 12, 26, 12, rightColors[i]);
            createTree(-15, zPos + 20, 1.5);
            createTree(15, zPos + 20, 1.5);
        }

        // ==========================================
        // 2. 사진 배경 및 UI 로직
        // ==========================================
        const drawCanvas = document.getElementById('drawCanvas');
        const ctx = drawCanvas.getContext('2d');
        const imgBgCanvas = document.getElementById('imgBgCanvas');
        const imgBgCtx = imgBgCanvas.getContext('2d');
        
        let paths = [], currentPath = null, isDrawing = false, isDrawingPhase = false;
        let vp = null, isSettingVP = false, loadedImg = null, initialPinchDist = null;
        const keys = {};

        // 사진 배경 불러오기
        const fileInput = document.getElementById('fileInput');
        document.getElementById('loadImageBtn').addEventListener('click', () => {
            if(loadedImg) { if(confirm("사진 배경을 지울까요?")) { loadedImg = null; imgBgCanvas.style.display='none'; document.getElementById('imgBgOpGroup').style.display='none'; document.getElementById('loadImageBtn').textContent="📷 배경 사진 넣기 (선택)"; redrawAll(); } }
            else fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (v) => {
                const img = new Image();
                img.onload = () => {
                    loadedImg = img;
                    imgBgCanvas.style.display = 'block';
                    document.getElementById('imgBgOpGroup').style.display = 'flex';
                    document.getElementById('loadImageBtn').textContent = "🗑️ 사진 배경 지우기";
                    drawImgBg();
                    redrawAll();
                };
                img.src = v.target.result;
            };
            reader.readAsDataURL(file);
        });

        function drawImgBg() {
            if(!loadedImg) return;
            imgBgCanvas.width = window.innerWidth; imgBgCanvas.height = window.innerHeight;
            const ratio = Math.max(imgBgCanvas.width/loadedImg.width, imgBgCanvas.height/loadedImg.height);
            const w = loadedImg.width*ratio, h = loadedImg.height*ratio;
            imgBgCtx.clearRect(0,0,imgBgCanvas.width, imgBgCanvas.height);
            imgBgCtx.globalAlpha = document.getElementById('imgBgOpacity').value / 100;
            imgBgCtx.drawImage(loadedImg, (imgBgCanvas.width-w)/2, (imgBgCanvas.height-h)/2, w, h);
        }

        // ==========================================
        // 3. 이동 및 카메라 업데이트 (버튼/터치)
        // ==========================================
        window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(e.ctrlKey && e.key.toLowerCase()==='z') undoPath(); });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        document.getElementById('mobileCtrlToggle').addEventListener('change', (e) => {
            document.getElementById('mobileControls').style.display = e.target.checked ? 'flex' : 'none';
        });

        const pressFwd = (e) => { e.preventDefault(); keys['w'] = true; };
        const releaseFwd = (e) => { e.preventDefault(); keys['w'] = false; };
        const pressBwd = (e) => { e.preventDefault(); keys['s'] = true; };
        const releaseBwd = (e) => { e.preventDefault(); keys['s'] = false; };

        document.getElementById('btnForward').addEventListener('mousedown', pressFwd); document.getElementById('btnForward').addEventListener('touchstart', pressFwd, {passive:false});
        document.getElementById('btnForward').addEventListener('mouseup', releaseFwd); document.getElementById('btnForward').addEventListener('touchend', releaseFwd);
        document.getElementById('btnBackward').addEventListener('mousedown', pressBwd); document.getElementById('btnBackward').addEventListener('touchstart', pressBwd, {passive:false});
        document.getElementById('btnBackward').addEventListener('mouseup', releaseBwd); document.getElementById('btnBackward').addEventListener('touchend', releaseBwd);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            let speed = keys['shift'] ? 45 : 30; 
            
            if(!loadedImg) {
                if(keys['w']) camera.position.z -= speed * delta;
                if(keys['s']) camera.position.z += speed * delta;
                if(camera.position.z < MIN_Z) camera.position.z = MIN_Z;
                if(camera.position.z > START_Z) camera.position.z = START_Z;
                document.getElementById('distance').textContent = `이동 거리: ${Math.abs(START_Z - camera.position.z).toFixed(0)} / ${MAX_DISTANCE}`;
            }
            renderer.render(scene, camera);
        }
        animate();

        // ==========================================
        // 4. 핵심 드로잉 및 채우기 알고리즘
        // ==========================================
        function undoPath() { if(paths.length>0) { paths.pop(); redrawAll(); } }
        document.getElementById('undoBtn').addEventListener('click', undoPath);
        document.getElementById('clearBtn').addEventListener('click', () => { paths=[]; vp=null; redrawAll(); });
        
        function hexToRgba(hex) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return [r, g, b, 255];
        }

        function floodFill(startX, startY, fillColor) {
            const w = drawCanvas.width, h = drawCanvas.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const startOffset = (startY * w + startX) * 4;
            const targetColor = [data[startOffset], data[startOffset+1], data[startOffset+2], data[startOffset+3]];
            const fillRgba = hexToRgba(fillColor);

            if (Math.abs(targetColor[0] - fillRgba[0]) < 5 && Math.abs(targetColor[1] - fillRgba[1]) < 5 && Math.abs(targetColor[2] - fillRgba[2]) < 5 && targetColor[3] > 200) return null;

            const fillLayer = new ImageData(w, h);
            const fData = fillLayer.data;

            function match(offset) {
                const r = data[offset], g = data[offset+1], b = data[offset+2], a = data[offset+3];
                if (targetColor[3] === 0) return a < 150; 
                return Math.abs(r - targetColor[0]) < 30 && Math.abs(g - targetColor[1]) < 30 && Math.abs(b - targetColor[2]) < 30 && Math.abs(a - targetColor[3]) < 30;
            }

            const stack = [startX, startY];
            while (stack.length > 0) {
                let y = stack.pop(), x = stack.pop();
                let offset = (y * w + x) * 4;
                let startX2 = x;
                while (startX2 >= 0 && match(offset)) { startX2--; offset -= 4; }
                startX2++; offset += 4;
                let reachAbove = false, reachBelow = false;
                while (startX2 < w && match(offset)) {
                    data[offset] = fillRgba[0]; data[offset+1] = fillRgba[1]; data[offset+2] = fillRgba[2]; data[offset+3] = fillRgba[3];
                    fData[offset] = fillRgba[0]; fData[offset+1] = fillRgba[1]; fData[offset+2] = fillRgba[2]; fData[offset+3] = fillRgba[3];
                    if (y > 0) {
                        if (match(offset - w * 4)) { if (!reachAbove) { stack.push(startX2, y - 1); reachAbove = true; } }
                        else if (reachAbove) { reachAbove = false; }
                    }
                    if (y < h - 1) {
                        if (match(offset + w * 4)) { if (!reachBelow) { stack.push(startX2, y + 1); reachBelow = true; } }
                        else if (reachBelow) { reachBelow = false; }
                    }
                    startX2++; offset += 4;
                }
            }
            const offCanvas = document.createElement('canvas');
            offCanvas.width = w; offCanvas.height = h;
            offCanvas.getContext('2d').putImageData(fillLayer, 0, 0);
            return offCanvas;
        }

        function redrawAll() {
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            const all = currentPath ? [...paths, currentPath] : paths;
            all.forEach(p => {
                if(p.type === 'fill') { ctx.drawImage(p.img, 0, 0); }
                else {
                    ctx.beginPath();
                    ctx.strokeStyle = (isDrawingPhase && p.isGuide) ? '#bbb' : p.color;
                    ctx.lineWidth = p.width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    if(p.type === 'line'){
                        const dx = p.endX-p.startX, dy = p.endY-p.startY, len = Math.sqrt(dx*dx+dy*dy);
                        if(len>0.1){ ctx.moveTo(p.startX-dx/len*3000, p.startY-dy/len*3000); ctx.lineTo(p.startX+dx/len*3000, p.startY+dy/len*3000); }
                    } else if(p.type === 'segment'){
                        ctx.moveTo(p.startX, p.startY); ctx.lineTo(p.endX, p.endY);
                    } else {
                        if(p.points.length>0){ ctx.moveTo(p.points[0].x, p.points[0].y); p.points.forEach(pt => ctx.lineTo(pt.x, pt.y)); }
                    }
                    ctx.stroke();
                }
            });
            if(vp){
                let alpha = document.getElementById('gridOpacity').value/100;
                ctx.beginPath(); ctx.strokeStyle = `rgba(150,150,150,${alpha})`; ctx.lineWidth = 1;
                for(let i=0; i<360; i+=15){
                    let r = i*Math.PI/180; ctx.moveTo(vp.x, vp.y); ctx.lineTo(vp.x+Math.cos(r)*3000, vp.y+Math.sin(r)*3000);
                }
                let maxSize = Math.max(drawCanvas.width, drawCanvas.height);
                for (let i = 0; i < maxSize; i += 80) {
                    ctx.moveTo(0, vp.y + i); ctx.lineTo(drawCanvas.width, vp.y + i); ctx.moveTo(0, vp.y - i); ctx.lineTo(drawCanvas.width, vp.y - i);
                    ctx.moveTo(vp.x + i, 0); ctx.lineTo(vp.x + i, drawCanvas.height); ctx.moveTo(vp.x - i, 0); ctx.lineTo(vp.x - i, drawCanvas.height);
                }
                ctx.stroke();
                ctx.beginPath(); ctx.fillStyle = 'red'; ctx.arc(vp.x, vp.y, 6, 0, Math.PI*2); ctx.fill();
            }
        }

        // --- 마우스 및 터치 이벤트 통합 ---
        function getPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) {
            if(e.touches && e.touches.length === 2 && !loadedImg) {
                initialPinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
                return;
            }
            if(!document.getElementById('drawModeToggle').checked) return;
            const pos = getPos(e);
            
            if(isSettingVP) { vp = pos; isSettingVP = false; document.getElementById('modeHint').innerHTML="✅ 소실점이 설정되었습니다.<br>2단계로 넘어가 스케치를 시작하세요!"; redrawAll(); return; }
            
            isDrawing = true;
            let type = isDrawingPhase ? document.querySelector('input[name="drawType"]:checked').value : 'line';
            
            if(type === 'bucket') {
                const fillCanvas = floodFill(Math.floor(pos.x), Math.floor(pos.y), document.getElementById('colorPicker').value);
                if(fillCanvas) { paths.push({ type: 'fill', img: fillCanvas }); redrawAll(); }
                isDrawing = false;
            } else {
                currentPath = { type, startX: pos.x, startY: pos.y, endX: pos.x, endY: pos.y, points: [pos], color: document.getElementById('colorPicker').value, width: document.getElementById('lineWidth').value, isGuide: !isDrawingPhase };
            }
        }

        function moveDrawing(e) {
            if(e.touches && e.touches.length === 2 && !loadedImg && initialPinchDist) {
                let d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
                camera.position.z -= (d - initialPinchDist) * 0.4;
                initialPinchDist = d; return;
            }
            if(!isDrawing) return;
            e.preventDefault(); 
            const pos = getPos(e);
            if(currentPath.type === 'freehand') currentPath.points.push(pos);
            else { currentPath.endX = pos.x; currentPath.endY = pos.y; }
            redrawAll();
        }

        function endDrawing() {
            if(isDrawing && currentPath) { paths.push(currentPath); currentPath = null; isDrawing = false; redrawAll(); }
            initialPinchDist = null;
        }

        drawCanvas.addEventListener('mousedown', startDrawing);
        window.addEventListener('mousemove', moveDrawing);
        window.addEventListener('mouseup', endDrawing);

        drawCanvas.addEventListener('touchstart', (e) => { if(e.touches.length === 1) e.preventDefault(); startDrawing(e); }, {passive:false});
        drawCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveDrawing(e); }, {passive:false});
        window.addEventListener('touchend', endDrawing);

        // --- 5. UI 및 저장 제어 ---
        document.getElementById('setVpBtn').addEventListener('click', () => { isSettingVP = true; document.getElementById('modeHint').innerHTML="🔴 <b>교차하는 중심을 터치하세요!</b>"; });
        
        document.getElementById('phaseBtn').addEventListener('click', () => {
            isDrawingPhase = true;
            document.querySelectorAll('.phase2-only').forEach(el => el.style.display = 'block');
            document.getElementById('drawTools').style.display = 'flex';
            document.getElementById('imgBgOpGroup').style.display = 'flex';
            document.getElementById('phaseText').textContent = "2단계: 드로잉 및 채색";
            document.getElementById('phaseBtn').style.display = 'none';
            document.getElementById('setVpBtn').style.display = 'none';
            document.getElementById('modeHint').innerHTML = "투명도를 조절하고 마음껏 스케치하세요.";
            redrawAll();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if(!confirm("모든 작업을 초기화할까요?")) return;
            paths = []; vp = null; isDrawingPhase = false; isSettingVP = false; loadedImg = null;
            camera.position.z = START_Z;
            document.getElementById('threeCanvas').style.opacity = 1;
            document.getElementById('bgOpacity').value = 100;
            document.getElementById('imgBgOpacity').value = 100;
            document.getElementById('gridOpacity').value = 25;
            document.getElementById('imgBgCanvas').style.display = 'none';
            document.querySelectorAll('.phase2-only').forEach(el => el.style.display = 'none');
            document.getElementById('phaseBtn').style.display = 'block';
            document.getElementById('setVpBtn').style.display = 'block';
            document.getElementById('phaseText').textContent = "1단계: 소실점 찾기";
            redrawAll();
        });

        document.getElementById('bgOpacity').addEventListener('input', e => { document.getElementById('threeCanvas').style.opacity = e.target.value/100; });
        document.getElementById('imgBgOpacity').addEventListener('input', drawImgBg);
        document.getElementById('gridOpacity').addEventListener('input', redrawAll);

        document.getElementById('saveBtn').addEventListener('click', () => {
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = window.innerWidth; finalCanvas.height = window.innerHeight;
            const fCtx = finalCanvas.getContext('2d');
            
            fCtx.fillStyle = '#ffffff'; fCtx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
            
            if(loadedImg) {
                fCtx.globalAlpha = document.getElementById('imgBgOpacity').value / 100;
                const ratio = Math.max(finalCanvas.width/loadedImg.width, finalCanvas.height/loadedImg.height);
                const w = loadedImg.width*ratio, h = loadedImg.height*ratio;
                fCtx.drawImage(loadedImg, (finalCanvas.width-w)/2, (finalCanvas.height-h)/2, w, h);
            } else {
                fCtx.globalAlpha = document.getElementById('bgOpacity').value / 100;
                fCtx.drawImage(document.getElementById('threeCanvas'), 0, 0);
            }
            
            fCtx.globalAlpha = 1.0;
            paths.forEach(p => {
                if (p.isGuide) return; 
                if (p.type === 'fill') { fCtx.drawImage(p.img, 0, 0); }
                else {
                    fCtx.beginPath(); fCtx.strokeStyle = p.color; fCtx.lineWidth = p.width; fCtx.lineCap = 'round'; fCtx.lineJoin = 'round';
                    if (p.type === 'segment') { fCtx.moveTo(p.startX, p.startY); fCtx.lineTo(p.endX, p.endY); }
                    else if (p.type === 'freehand') { if (p.points.length > 0) { fCtx.moveTo(p.points[0].x, p.points[0].y); p.points.forEach(pt => fCtx.lineTo(pt.x, pt.y)); } }
                    fCtx.stroke();
                }
            });
            
            const link = document.createElement('a'); link.download = 'my_perspective_art.png'; link.href = finalCanvas.toDataURL(); link.click();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            drawCanvas.width = window.innerWidth; drawCanvas.height = window.innerHeight;
            if(loadedImg) drawImgBg();
            redrawAll();
        });
        drawCanvas.width = window.innerWidth; drawCanvas.height = window.innerHeight;
    </script>
</body>
</html>
